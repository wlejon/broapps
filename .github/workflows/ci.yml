name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# broapps resolves its one sibling, brovfs, from ../brovfs first (see the
# BROVFS_DIR block in CMakeLists.txt), so the test jobs reconstruct that layout
# in the runner workspace before configuring:
#
#     $GITHUB_WORKSPACE/
#       broapps/   <- this repo, checked out into a named path, not the root
#       brovfs/
#       bronze/    <- the JavaScript runtime broapps_api binds
#       brass/     <- bronze's code generator
#
# bronze and brass are laid out by bronze's checkout-toolchain action in every
# job, the submodule fallback included. brovfs's own api is off here (it
# defaults on only when brovfs is the top-level project).
#
# Hence `path:` on the checkouts and `cmake -S broapps`. brovfs is taken from
# main, which mirrors how the stack is developed (everything tracks main), so
# this CI also catches a breaking change landing in brovfs.
#
# The `submodule` job builds the other way, from third_party/brovfs with no
# sibling beside it, so the fallback a consumer without the sibling layout
# relies on cannot rot.
env:
  LINUX_PACKAGES: >-
    ninja-build shared-mime-info hicolor-icon-theme desktop-file-utils xdg-utils

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Release }
          - { name: linux-clang,        os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release }
          - { name: windows-msvc,       os: windows-2022,                          config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022,                          config: Debug }
          - { name: macos-arm64,        os: macos-15,                              config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: broapps

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brovfs
          path: brovfs

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S broapps -B build
          else
            cmake -S broapps -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # ctest shows a skipped test's output nowhere, so its reason goes to the
      # job summary: a skip is only honest if someone can read why.
      - name: Skip reasons
        if: always()
        shell: bash
        run: |
          { echo "### Skipped tests (${{ matrix.name }})"; echo '```'
            grep -h 'SKIPPED:' build/Testing/Temporary/LastTest*.log || echo none
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Submodule fallback ────────────────────────────────────────────────────
  #
  # No sibling checkout: brovfs comes from the third_party/brovfs submodule at
  # the commit this repo pins. The configure step checks it really took that
  # path rather than finding a stray ../brovfs.
  submodule:
    name: Submodule fallback · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: broapps
          submodules: recursive

      # bronze/brass are the documented exception to the submodule rule: the
      # api compiles against the bronze of the program that loads it.
      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Configure
        run: |
          test ! -e brovfs
          cmake -S broapps -B build -G Ninja -DCMAKE_BUILD_TYPE=Release | tee configure.log
          grep -q 'brovfs from .*third_party/brovfs (submodule)' configure.log

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Scoped to broapps' own src/ and include/: brovfs is measured by its own CI.
  # Debug (-O0), so this is also the Linux job where assert()s are live.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: broapps

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brovfs
          path: brovfs

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcovr $LINUX_PACKAGES

      - name: Configure (instrumented)
        run: |
          cmake -S broapps -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROAPPS_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      #
      # Run from the workspace root, where build/ is, with the filters spelled
      # broapps/...: gcovr only looks for .gcda files under its root.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'broapps/src/' --filter 'broapps/include/broapps/' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/` + `include/broapps/`'
            echo
            echo 'Linux backends only; brovfs is measured by its own CI, and the Windows and macOS backends are exercised by the test matrix, not measured.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
