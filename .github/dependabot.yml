version: 2

# No package manifest to watch. The one sibling, brovfs, resolves from
# ../brovfs first, and CI checks it out from main, so it is always current
# there. The third_party/brovfs submodule is only the fallback for builds
# without the sibling layout, and its pin is moved by hand, deliberately, when
# broapps needs a newer brovfs. That leaves the pinned actions in
# .github/workflows/.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
    ignore:
      # GitHub maintains the `v4` major tag and ships security fixes to it, so
      # `@v4` is already patched without any PR. Pinning to an exact patch would
      # trade that automatic patching for a codeql-action PR in every repo on
      # each release. Major bumps (v4 -> v5) still come through.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
